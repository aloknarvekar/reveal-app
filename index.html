<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal App</title>
<!-- Save face-api.min.js in the same folder as this file (see guide, Step 4) -->
<script src="face-api.min.js"></script>
<style>
  body{margin:0;background:#000;font-family:sans-serif;color:#fff}
  #wrap{position:relative;width:100vw}
  video,canvas{width:100%;display:block}
  canvas{position:absolute;top:0;left:0}
  #toggles{display:flex;gap:8px;padding:10px}
  button{flex:1;padding:14px;font-size:16px;border:0;border-radius:8px;background:#333;color:#fff}
  button.on{background:#e91e63}
  #banner{display:none;position:absolute;bottom:20px;left:0;right:0;text-align:center;
    font-size:28px;font-weight:bold;background:rgba(233,30,99,.9);padding:16px}
  #rec{display:none;position:absolute;top:10px;right:10px;color:red;font-weight:bold}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="rec">● REC</div>
  <div id="banner">👶 We are having a baby!</div>
</div>
<div id="toggles">
  <button data-mode="past">Past</button>
  <button data-mode="present" class="on">Present</button>
  <button data-mode="future">Future</button>
</div>
  <div style="padding:0 10px 10px"><button id="flip" style="width:100%">🔄 Switch camera</button></div>
<p id="status" style="padding:0 10px">Loading...</p>

<script>
// ===== 1. YOUR DATABASE: edit names, photo files and text =====
const PEOPLE = [
  { name:"Alok Narvekar", photo:"photos/Alok Narvekar.jpg",
    past:"God", present:"Manushya",
    future:"Father of the baby" },
  { name:"Raj", photo:"photos/raj.jpg",
    past:"Football captain", present:"Teacher",
    future:"Father of the baby" },
  { name:"Meera", photo:"photos/meera.jpg",
    past:"Village nurse", present:"Retired doctor",
    future:"Grandmother of the baby" },
];

// ===== 2. SETUP =====
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const status = document.getElementById('status');
const banner = document.getElementById('banner');
const recLabel = document.getElementById('rec');
let mode = 'present', matcher, stream, recorder, chunks = [], timer;

async function start(){
  try{
    await faceapi.nets.ssdMobilenetv1.loadFromUri('models');
    await faceapi.nets.faceLandmark68Net.loadFromUri('models');
    await faceapi.nets.faceRecognitionNet.loadFromUri('models');
    status.textContent = "Models loaded. Starting camera...";

    await startCamera();

    const labeled = [];
    for (const p of PEOPLE){
      try{
        const img = await faceapi.fetchImage(p.photo);
        const d = await faceapi.detectSingleFace(img)
                    .withFaceLandmarks().withFaceDescriptor();
        if (d) labeled.push(new faceapi.LabeledFaceDescriptors(p.name,[d.descriptor]));
        else console.warn("No face found in", p.photo);
      }catch(e){ console.warn("Could not load", p.photo); }
    }
    if (!labeled.length){ status.textContent = "No database photos loaded. Check the photos folder."; return; }
    matcher = new faceapi.FaceMatcher(labeled, 0.5);
    status.textContent = "Ready";
  }catch(e){
    status.textContent = "Error: " + e.message;
  }
}
let facing = 'environment';  // change to 'user' to start on the front camera

async function startCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } },
    audio:true });
  video.srcObject = stream;
  try{
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous'))
      await track.applyConstraints({ advanced:[{ focusMode:'continuous' }] });
  }catch(e){ console.warn('Focus control not available'); }
}

document.getElementById('flip').onclick = async () => {
  if (mode === 'future'){ status.textContent = 'Leave Future mode before switching camera'; return; }
  facing = facing === 'user' ? 'environment' : 'user';
  await startCamera();
};

video.addEventListener('play', () => {
  if (!window.looping){ window.looping = true; loop(); }
});

// ===== 3. DETECT + DRAW (name on top, details at bottom) =====
async function loop(){
  try{
    if (video.videoWidth){
      if (canvas.width !== video.videoWidth){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      }
      const ctx = canvas.getContext('2d');
      if (matcher){
        const opts = new faceapi.SsdMobilenetv1Options({ minConfidence:0.3 });
        const faces = await faceapi.detectAllFaces(video, opts)
                        .withFaceLandmarks().withFaceDescriptors();
        status.textContent = "Faces found: " + faces.length;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for (const f of faces){
          const m = matcher.findBestMatch(f.descriptor);
          const person = PEOPLE.find(p => p.name === m.label);
          const b = f.detection.box;
          ctx.strokeStyle = '#00e676'; ctx.lineWidth = 6;
          ctx.strokeRect(b.x, b.y, b.width, b.height);
          ctx.font = "bold 32px sans-serif";
          const nameText = person ? person.name : "Unknown";
          const infoText = person ? person[mode] : "";
          ctx.fillStyle = '#00e676';
          ctx.fillRect(b.x, b.y - 44, ctx.measureText(nameText).width + 16, 44);
          ctx.fillStyle = '#000';
          ctx.fillText(nameText, b.x + 8, b.y - 11);
          if (infoText){
            ctx.fillStyle = '#00e676';
            ctx.fillRect(b.x, b.y + b.height, ctx.measureText(infoText).width + 16, 44);
            ctx.fillStyle = '#000';
            ctx.fillText(infoText, b.x + 8, b.y + b.height + 33);
          }
        }
      }
    }
  }catch(e){
    status.textContent = "Detect error: " + e.message;
  }
  requestAnimationFrame(loop);
}
// ===== 4. TOGGLES =====
document.querySelectorAll('#toggles button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#toggles button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const wasFuture = mode === 'future';
    mode = btn.dataset.mode;
    if (mode === 'future') startFuture();
    else if (wasFuture) stopFuture();
  };
});

// ===== 5. FUTURE: RECORD + 15 SECOND REVEAL =====
function startFuture(){
  if (!stream) return;
  chunks = [];
  try{
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = saveVideo;
    recorder.start();
  }catch(e){ console.warn("Recording not supported", e); }
  recLabel.style.display = 'block';
  timer = setTimeout(() => { banner.style.display = 'block'; }, 15000);
}
function stopFuture(){
  clearTimeout(timer);
  banner.style.display = 'none';
  recLabel.style.display = 'none';
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}
function saveVideo(){
  const blob = new Blob(chunks, { type:'video/webm' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reveal.webm';
  a.click();
}

start();
</script>
</body>
</html>
